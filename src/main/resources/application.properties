server.port=8082

user.service.url=${USER_SERVICE_URL:http://localhost:8080}

jwt.secret=${JWT_SECRET:mySecretKeyForJWTTokenGeneration2025!VeryLongAndSecure}
jwt.access.expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:604800000}

spring.datasource.url=${AUTH_DB_URL}
spring.datasource.username=${AUTH_DB_USERNAME}
spring.datasource.password=${AUTH_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/changelog/db.changelog-auth.yaml

management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info